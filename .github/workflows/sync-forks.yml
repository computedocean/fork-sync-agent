name: Sync forks

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report, don't sync"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-forks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync forks with upstream
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          EXCLUDE: ${{ vars.FORK_SYNC_EXCLUDE }}
          REPORT_REPO: ${{ github.repository }}
        run: python sync_forks.py
